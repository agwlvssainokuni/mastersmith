# テスト実行時はインメモリH2に切り替える(本番のファイルモードH2とは分離)。
# テストJVMごとに一意なDB名を用い、並行実行時の衝突を避ける。
# audit-logging(U7)前提修正でFlywayを導入したため、ddl-autoはvalidateとし、
# db/migration配下のマイグレーションを@SpringBootTest起動時にも適用させる
# (spring.flyway.enabledの既定値trueをそのまま利用、追加設定不要)。
spring:
  datasource:
    url: jdbc:h2:mem:mastersmith-config-test-${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.validation.mode: none
  # user-management(U4): 招待メール送信のためのJavaMailSenderを構成する。テストではSMTPへの
  # 接続は行わない(JavaMailSenderはモックまたは未使用)。実在しない値(ダミー)。
  mail:
    host: localhost
    port: 3025

mastersmith:
  users:
    # 起動時のfail fast検証(InitialAdminProperties)を通すための、実在しないダミー値。
    initial-admin:
      email: initial-admin@example.test
      password: dummy-initial-admin-passphrase
  mail:
    base-url: https://mastersmith.example.test
    from: no-reply@example.test

# SMTPの疎通は、健全性の判定に含めない(main/resources/application.ymlと同じ、NFR5.4)。
management:
  health:
    mail:
      enabled: false
