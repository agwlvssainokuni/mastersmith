# テスト実行時はインメモリH2に切り替える(本番のファイルモードH2とは分離)。
# テストJVMごとに一意なDB名を用い、並行実行時の衝突を避ける。
# audit-logging(U7)前提修正でFlywayを導入したため、ddl-autoはvalidateとし、
# db/migration配下のマイグレーションを@SpringBootTest起動時にも適用させる
# (spring.flyway.enabledの既定値trueをそのまま利用、追加設定不要)。
spring:
  datasource:
    url: jdbc:h2:mem:mastersmith-config-test-${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.validation.mode: none
      hibernate:
        # config-import-export(U9): main/resources/application.ymlと同じ(取り込みの反映のバッチ)。
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  # user-management(U4): 招待メール送信のためのJavaMailSenderを構成する。テストではSMTPへの
  # 接続は行わない(JavaMailSenderはモックまたは未使用)。実在しない値(ダミー)。
  mail:
    host: localhost
    port: 3025

mastersmith:
  auth:
    # 起動時のfail fast検証(JwtKeyProvider)を通すための、テスト専用のダミーの鍵(実在しない値、標準のBase64、
    # デコード後が32バイト以上)。本番の鍵ではない。
    jwt:
      secret: ZHVtbXktand0LXNlY3JldC1mb3ItdGVzdHMtb25seS0wMTIzNDU2Nzg5
    session:
      # テストで、定期削除が、意図せず走らないようにする(SessionCleanupJobTestは、runOnce()を直接呼ぶ)。
      cleanup-initial-delay: 1h
  users:
    # 起動時のfail fast検証(InitialAdminProperties)を通すための、実在しないダミー値。
    initial-admin:
      email: initial-admin@example.test
      password: dummy-initial-admin-passphrase
  mail:
    base-url: https://mastersmith.example.test
    from: no-reply@example.test

# SMTPの疎通は、健全性の判定に含めない(main/resources/application.ymlと同じ、NFR5.4)。
# actuatorの公開設定・ヘルスのキャッシュも、main/resources/application.ymlと同じ
# (AuthSecurityConfigTestが、本番と同じ規則を確認するため)。
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      cache:
        time-to-live: 5s
      # ヘルスのグループ(liveness・readinessなど)は設けない(応答は、状態(UP・DOWN)だけ)。
      probes:
        enabled: false
