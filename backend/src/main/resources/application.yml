# 内部設定DB(H2, ファイルモード)。表示設定・RBAC・ユーザ管理・監査ログ等、
# アプリ自身の設定を保持する。業務データ用RDBMS(PostgreSQL/MySQL/MariaDB)への
# 接続とは明確に分離する(team.md確定事項)。
spring:
  application:
    name: mastersmith
  datasource:
    url: jdbc:h2:file:./data/mastersmith-config;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: ${MASTERSMITH_CONFIG_DB_USERNAME:sa}
    password: ${MASTERSMITH_CONFIG_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 現時点ではマイグレーションツール(Flyway/Liquibase等)を導入していないため、
      # Hibernateのスキーマ自動更新を用いる。導入は今後のユニット/ステージで検討する。
      ddl-auto: update
    properties:
      # Bean Validationによる検証はConfigValidator(アプリケーション層)が明示的に実行する。
      # JPA永続化時の自動検証(Hibernate Validator連携)は無効化し、二重検証を避ける。
      jakarta.persistence.validation.mode: none
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

# 業務データ用RDBMS接続は本Boltでは未使用のプレースホルダ。
# schema-introspector/list-engine/record-edit-engineユニットで、内部設定DBとは別の
# DataSourceとして実装される想定(team.md「内部設定DB(新規決定)」を参照)。
mastersmith:
  business-datasource:
    enabled: false
