# 内部設定DB(H2, ファイルモード)。表示設定・RBAC・ユーザ管理・監査ログ等、
# アプリ自身の設定を保持する。業務データ用RDBMS(PostgreSQL/MySQL/MariaDB)への
# 接続とは明確に分離する(team.md確定事項)。
spring:
  application:
    name: mastersmith
  datasource:
    url: jdbc:h2:file:./data/mastersmith-config;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: ${MASTERSMITH_CONFIG_DB_USERNAME:sa}
    password: ${MASTERSMITH_CONFIG_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # audit-logging(U7)前提修正でFlywayを導入した(code-generation-plan.md「前提修正:
      # Flywayの導入」)。スキーマの作成・変更はFlywayのバージョン管理された移行スクリプト
      # (db/migration配下)が担い、Hibernateはvalidateでエンティティとのマッピング一致の
      # 検証のみを行う(スキーマの自動生成・変更は行わない)。
      ddl-auto: validate
    properties:
      # Bean Validationによる検証はConfigValidator(アプリケーション層)が明示的に実行する。
      # JPA永続化時の自動検証(Hibernate Validator連携)は無効化し、二重検証を避ける。
      jakarta.persistence.validation.mode: none
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false

# 業務データ用RDBMS(PostgreSQL/MySQL/MariaDB)接続。内部設定DBとは別のDataSourceとして
# BusinessDataSourceConfig(com.mastersmith.dataio.config)がenabled=trueの場合にのみBeanを
# 生成する(team.md「内部設定DB(新規決定)」を参照)。実際の接続先が未確定な開発環境では
# enabled=falseのまま(既定)にしておくことで、data-import-export(U8)を含むCSV
# エクスポート/インポート機能に依存しない他ユニットの起動に影響を与えない。
mastersmith:
  business-datasource:
    enabled: ${MASTERSMITH_BUSINESS_DB_ENABLED:false}
    url: ${MASTERSMITH_BUSINESS_DB_URL:}
    driver-class-name: ${MASTERSMITH_BUSINESS_DB_DRIVER:}
    username: ${MASTERSMITH_BUSINESS_DB_USERNAME:}
    password: ${MASTERSMITH_BUSINESS_DB_PASSWORD:}
