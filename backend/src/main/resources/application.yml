# 内部設定DB(H2, ファイルモード)。表示設定・RBAC・ユーザ管理・監査ログ等、
# アプリ自身の設定を保持する。業務データ用RDBMS(PostgreSQL/MySQL/MariaDB)への
# 接続とは明確に分離する(team.md確定事項)。
spring:
  application:
    name: mastersmith
  datasource:
    url: jdbc:h2:file:./data/mastersmith-config;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: ${MASTERSMITH_CONFIG_DB_USERNAME:sa}
    password: ${MASTERSMITH_CONFIG_DB_PASSWORD:}
    hikari:
      # user-management(U4、code-generation-plan.md 前提事項7(c)): 通常の同時処理数50、招待の
      # 上限5(SMTP応答待ちの間、接続を保持する)、入れ子の接続の余裕を見込んだ値。
      maximum-pool-size: 60
      # authentication-service(U5、code-generation-plan.md 前提事項8、logical-components.md 保留14番): 内部設定DBの
      # 接続の取得のタイムアウト(3秒)。認証は、内部設定DBの障害を、3秒以内に503にする(NFR4.2)。
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      # audit-logging(U7)前提修正でFlywayを導入した(code-generation-plan.md「前提修正:
      # Flywayの導入」)。スキーマの作成・変更はFlywayのバージョン管理された移行スクリプト
      # (db/migration配下)が担い、Hibernateはvalidateでエンティティとのマッピング一致の
      # 検証のみを行う(スキーマの自動生成・変更は行わない)。
      ddl-auto: validate
    properties:
      # Bean Validationによる検証はConfigValidator(アプリケーション層)が明示的に実行する。
      # JPA永続化時の自動検証(Hibernate Validator連携)は無効化し、二重検証を避ける。
      jakarta.persistence.validation.mode: none
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  # 招待メールの送信(user-management、FR2.8)。接続情報は環境変数から注入し、リポジトリには
  # 実値も既定値も置かない(NFR2.7・NFR2.8)。hostとportが未設定なら、起動時に失敗する
  # (プレースホルダが解決できない)。開発・動作確認ではMailpit(host=localhost、port=1025)を用いる。
  # SMTP接続の暗号化(STARTTLS・SMTPS)の要否は環境の設定に任せ、アプリケーションでは強制しない
  # (nfr-design/security-design.md NFR2.7、Q2=B)。
  mail:
    host: ${MASTERSMITH_SMTP_HOST}
    port: ${MASTERSMITH_SMTP_PORT}
    username: ${MASTERSMITH_SMTP_USERNAME:}
    password: ${MASTERSMITH_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MASTERSMITH_SMTP_AUTH:false}
          starttls:
            enable: ${MASTERSMITH_SMTP_STARTTLS:false}
          # NFR1.4: 1回の操作ごとの上限(接続3秒・読み取り5秒・書き込み2秒)。送信全体の10秒の
          # 上限は、呼び出し側が結果を待つ時間の打ち切り(mastersmith.users.invitation.mail-timeout)で実現する。
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 2000

# ヘルスチェック(Spring Boot Actuator)。招待メールのSMTPの疎通は、健全性の判定に含めない
# (SMTPの不調でアプリケーション全体をunhealthyにしないため。user-management nfr-design
# observability-design.md NFR5.4)。SMTPの不調は、メトリクス(user.invitation.mail.failed)で検知する。
# SpringBootのメールのヘルスインジケータは、JavaMailSenderImplがあると既定で登録されるため、無効にする。
management:
  health:
    mail:
      enabled: false
  # authentication-service(U5、logical-components.md 保留15番): actuatorは、GET /actuator/healthだけを公開する
  # (ヘルスのグループは設けない)。ヘルスの結果は、5秒間キャッシュする(認証なしの呼び出しが、内部設定DBの接続を、
  # 5秒に1回を超えて使わないようにする)。その他のactuatorのエンドポイントは、公開設定にも含めない。
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      cache:
        time-to-live: 5s
      # ヘルスのグループ(liveness・readinessなど)は設けない(応答は、状態(UP・DOWN)だけ)。
      probes:
        enabled: false

# 業務データ用RDBMS(PostgreSQL/MySQL/MariaDB)接続。内部設定DBとは別のDataSourceとして
# BusinessDataSourceConfig(com.mastersmith.dataio.config)がenabled=trueの場合にのみBeanを
# 生成する(team.md「内部設定DB(新規決定)」を参照)。実際の接続先が未確定な開発環境では
# enabled=falseのまま(既定)にしておくことで、data-import-export(U8)を含むCSV
# エクスポート/インポート機能に依存しない他ユニットの起動に影響を与えない。
mastersmith:
  # authentication-service(U5)。トークンの有効期限・ロックのしきい値と時間・再送の猶予・Sessionの削除・キャッシュは、
  # コードに埋め込まず、ここから与える(NFR8.1、BR5.4)。値の範囲・整合は、起動時に検証し、不備があれば起動を失敗させる。
  # JWTの署名の鍵は、ここには置かない(既定値も実値も、リポジトリに置かない)。環境変数MASTERSMITH_AUTH_JWT_SECRET
  # (キーmastersmith.auth.jwt.secret)に、標準のBase64で表した32バイト(256ビット)以上の値を与える。未設定・
  # Base64として不正・32バイト未満の場合は、起動時に失敗する(値は、エラーに出力されない)。
  auth:
    access-token-ttl: 10m
    refresh-token-ttl: 30m
    # 更新済みのリフレッシュトークンの再送を許す猶予(BR5.6)。0で猶予なし(元の挙動: 再使用は、即、Sessionを失効させる)。
    refresh-reuse-grace: 10s
    lock:
      threshold: 5
      duration: 15m
    session:
      # 有効期限から、削除するまでの保持期間。
      retention: 7d
      cleanup-interval: 1d
      cleanup-initial-delay: 10m
      cleanup-batch-size: 1000
      cleanup-max-batches: 100
      # trueで、起動時に、すべてのSessionを削除する(バックアップからの復元後・鍵の漏えいの疑いのときの運用の手順)。
      # 設定を戻さないまま起動を繰り返すと、そのたびに削除される。
      revoke-all-on-startup: false
    cache:
      max-size: 1000
      ttl: 60s
  # user-management(U4)。Argon2idのパラメータ・同時実行数・タイムアウトはコードに埋め込まず、
  # ここから与える(NFR8.1)。
  users:
    hash:
      # Argon2id(OWASPの推奨の下限に沿った、メモリ19MiB・反復2・並列度1)。
      memory-kib: 19456
      iterations: 2
      parallelism: 1
      # 同時に実行できるハッシュ計算の数。0以下ならCPUコア数(NFR1.3)。
      max-concurrent: 0
      # ハッシュ計算の許可を待つ最大時間。超えたら503(NFR1.3)。
      wait-timeout: 2s
    invitation:
      # 招待の同時実行数(SMTP応答待ちの間、内部設定DBの接続を保持する招待の上限、NFR4.2)。
      max-concurrent: 5
      # 同一emailの排他を待つ最大時間(NFR4.2)。
      email-lock-wait: 12s
      # 招待メール送信の専用プールのスレッド数と、呼び出し側が結果を待つ最大時間(NFR1.4)。
      mail-pool-size: 5
      mail-timeout: 10s
    # User行のロック待ちの最大時間(NFR4.2)。
    db-lock-timeout: 15s
    # 初期管理者(FR2.4、NFR2.11)。実値も既定値もリポジトリに置かず、環境変数から注入する。
    # 未設定の場合は、起動時に失敗する。
    initial-admin:
      email: ${MASTERSMITH_INITIAL_ADMIN_EMAIL}
      password: ${MASTERSMITH_INITIAL_ADMIN_PASSWORD}
      role-ids: ${MASTERSMITH_INITIAL_ADMIN_ROLE_IDS:}
  # 招待メール(user-management、NFR2.7)。招待リンクのベースURLは設定値から作り、リクエストの
  # Hostなどのヘッダーからは導出しない。httpは、allow-insecure-linkがtrueの場合(開発のMailpit
  # 環境向け)に限って許可する。
  mail:
    base-url: ${MASTERSMITH_MAIL_BASE_URL}
    from: ${MASTERSMITH_MAIL_FROM}
    allow-insecure-link: ${MASTERSMITH_MAIL_ALLOW_INSECURE_LINK:false}
  business-datasource:
    enabled: ${MASTERSMITH_BUSINESS_DB_ENABLED:false}
    url: ${MASTERSMITH_BUSINESS_DB_URL:}
    driver-class-name: ${MASTERSMITH_BUSINESS_DB_DRIVER:}
    username: ${MASTERSMITH_BUSINESS_DB_USERNAME:}
    password: ${MASTERSMITH_BUSINESS_DB_PASSWORD:}
